name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # On pushes, compare with the previous branch tip. PRs use the PR diff.
          base: ${{ github.ref }}
          filters: |
            python:
              - '**/*.py'
              - '**/*.pyi'
              - 'pyproject.toml'
              - '**/ruff.toml'
              - '**/.ruff.toml'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '**/*.markdown'
              - '.markdownlint*'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        if: steps.changes.outputs.python == 'true'
        run: python -m pip install --disable-pip-version-check '.[lint]'
      - name: Lint Python
        if: steps.changes.outputs.python == 'true'
        run: ruff check .
      - name: Set up Node for Markdownlint
        if: steps.changes.outputs.markdown == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install Markdownlint
        if: steps.changes.outputs.markdown == 'true'
        run: npm ci --ignore-scripts
      - name: Lint Markdown
        if: steps.changes.outputs.markdown == 'true'
        run: npm run lint:markdown
      - name: Compile
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate default track manifest
        run: python -m tools.mdplus_builder validate-manifest --manifest config/tracks.json
      - name: Install ROM build and CPU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.3
          python -m pip install --disable-pip-version-check '.[emulation]'
      - name: Build pinned stock references and canonical production ROM
        run: |
          make bootstrap
          make build-stock-modern
          make build-stock-bugfixed
          make rom
          python -m tools.mdplus_builder verify-rom --strict-regression build/sonic2-mdplus.md
      - name: Verify cutover identities and source pin
        run: PYTHONPATH=. python tests/check_production_binary.py
      - name: Execute compiled production CPU suites
        run: |
          PYTHONPATH=. python tests/check_modern_binary.py
          PYTHONPATH=. python tests/check_modern_handoff_binary.py
          PYTHONPATH=. python tests/check_modern_live_binary.py
      - name: Reject unsupported fixBugs layout
        run: PYTHONPATH=. python tests/check_modern_fixbugs.py
      - name: Build and verify the isolated Bugfixed flavour
        run: |
          make rom-bugfixed
          python -m tools.mdplus_builder verify-rom --bugfixed --strict-regression build/sonic2-mdplus-bugfixed.md
          FORGE_TEST_VARIANT=bugfixed PYTHONPATH=. python tests/check_modern_binary.py
          FORGE_TEST_VARIANT=bugfixed PYTHONPATH=. python tests/check_modern_handoff_binary.py
          FORGE_TEST_VARIANT=bugfixed PYTHONPATH=. python tests/check_modern_live_binary.py
          PYTHONPATH=. python tests/check_bugfixed_binary.py
      - name: Audit curated stock Bugfixed policy, layout and deterministic isolation
        run: PYTHONPATH=. python tests/check_stock_bugfixed_binary.py
      - name: Audit selective audio data against v3 and upstream fixed semantics
        run: PYTHONPATH=. python tests/check_audio_data_binary.py
